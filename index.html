<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO-COMBAT // NECK KICKER</title>
<style>
  :root{
    --neon-cyan:#00ffcc;
    --neon-red:#ff3366;
    --bg-deep:#05070f;
    --ui-border:#23304a;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    height:100%;
  }
  body{
    background:radial-gradient(ellipse at center, #0c1120 0%, #05060b 70%);
    color:var(--neon-cyan);
    font-family:'Courier New', monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    min-height:100vh;
    padding:14px;
  }
  .arcade-frame{
    position:relative;
    padding:14px;
    border-radius:14px;
    background:linear-gradient(160deg,#141a2b,#0a0d16);
    box-shadow:
      0 0 0 1px var(--ui-border),
      0 0 40px rgba(0,255,204,0.14),
      inset 0 0 20px rgba(0,0,0,0.6);
  }
  .title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin:0 2px 10px;
    gap:12px;
  }
  h1{
    margin:0;
    font-size:19px;
    letter-spacing:2.5px;
    font-weight:700;
    white-space:nowrap;
    text-shadow:0 0 8px var(--neon-cyan), 0 0 20px rgba(0,255,204,.45);
  }
  h1 em{
    font-style:normal;
    color:var(--neon-red);
    text-shadow:0 0 8px var(--neon-red), 0 0 20px rgba(255,51,102,.45);
  }
  .badge{
    font-size:10px;
    letter-spacing:1.5px;
    color:#5b6a8c;
    border:1px solid var(--ui-border);
    padding:3px 8px;
    border-radius:999px;
    white-space:nowrap;
  }
  #gameCanvas{
    display:block;
    max-width:92vw;
    height:auto;
    touch-action:none;
    border-radius:6px;
    border:2px solid #1c2740;
    background:#05070f;
    box-shadow:0 0 40px rgba(0,255,204,0.12), inset 0 0 60px rgba(0,0,0,0.7);
  }
  .ui-panel{
    margin-top:12px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:18px;
    font-size:12px;
    letter-spacing:.5px;
    color:#7c8db3;
  }
  .ui-panel b{ color:var(--neon-cyan); }
  kbd{
    background:#131a2c;
    border:1px solid #2a3757;
    border-bottom-width:2px;
    border-radius:4px;
    padding:1px 6px;
    color:#dfe8ff;
    font-family:inherit;
    font-size:11px;
  }
  .footer-note{
    margin-top:8px;
    font-size:10px;
    color:#3b4664;
    text-align:center;
    letter-spacing:.5px;
  }
</style>
</head>
<body>

<div class="arcade-frame">
  <div class="title-row">
    <h1>NEO-COMBAT // <em>NECK KICKER</em></h1>
    <div class="badge">ARCADE BUILD</div>
  </div>
  <canvas id="gameCanvas" width="960" height="480"></canvas>
  <div class="ui-panel">
    <div><kbd>A</kbd><kbd>D</kbd> MOVE</div>
    <div><kbd>S</kbd> BLOCK</div>
    <div><kbd>SPACE</kbd> <b>NECK KICK</b></div>
    <div><kbd>R</kbd> RESTART</div>
  </div>
  <div class="footer-note">sfx synthesized live — click the arena once to enable audio</div>
</div>

<script>
(function(){
  "use strict";

  // ---------- setup & constants ----------
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const GROUND_Y = 400;
  const HEAD_RADIUS = 16;
  const NECK_HEIGHT = 18;
  const TORSO_HEIGHT = 56;
  const GRAVITY = 0.65;

  const STATE = { TITLE:'TITLE', FIGHT:'FIGHT', ROUND_OVER:'ROUND_OVER' };
  let gameState = STATE.TITLE;
  let winner = null;      // 'player' | 'opponent'
  let winMethod = null;   // 'ko' | 'timeout'
  let roundTime = 60;
  let roundTimerAcc = 0;
  let frame = 0;

  let shake = { t:0, mag:0 };
  let hitStop = 0;

  const player = {
    x:220, y:0, vy:0, speed:5.4, facing:1,
    hp:100, maxHp:100,
    isAttacking:false, attackTimer:0, attackCooldown:0,
    isGrounded:true, isBlocking:false, staggerTimer:0,
    comboCount:0, comboTimer:0, armExtend:0,
    dialog:"you ain't scared of me", dialogTimer:0
  };

  const opponent = {
    x:700, y:0, facing:-1,
    hp:100, maxHp:100,
    neckScaleY:1, targetNeckScaleY:1, compressionTimer:0,
    ai:{ state:'IDLE', timer:40 },
    isAttacking:false, staggerTimer:0, armExtend:0,
    dialog:"no i ain't", dialogTimer:0,
    koTimer:0,
    headOffset:{ x:0, y:0, rot:0, vx:0, vy:0, vr:0, baseX:0, baseY:0 }
  };

  let particles = [];
  let shockwaves = [];
  let floatTexts = [];

  const stars = Array.from({length:70}, () => ({
    x: Math.random()*W, y: Math.random()*GROUND_Y*0.9,
    r: Math.random()*1.6+0.3, tw: Math.random()*Math.PI*2
  }));

  const PLAYER_INTRO_LINES   = ["you ain't scared of me", "let's dance", "come get some"];
  const OPPONENT_INTRO_LINES = ["no i ain't", "bring it on", "big mistake"];
  const OPPONENT_HIT_LINES   = ["gah!", "not the neck!", "ok that hurt", "still standing", "argh-"];
  const PLAYER_TAUNTS        = ["told you", "neck's next", "stay down", "too easy"];

  const keys = { a:false, d:false, s:false };
  let audioCtx = null;

  // ---------- helpers ----------
  function lerp(a,b,t){ return a+(b-a)*t; }
  function easeOutQuad(t){ return 1-(1-t)*(1-t); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function addShake(mag,t){ shake.mag = Math.max(shake.mag,mag); shake.t = Math.max(shake.t,t); }

  // ---------- audio (synthesized, no files) ----------
  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  }
  function playTone({freq=440, dur=0.1, type='square', vol=0.15, sweep=null}={}){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if(sweep) osc.frequency.exponentialRampToValueAtTime(Math.max(sweep,1), audioCtx.currentTime+dur);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime+dur);
  }
  function sfxWhoosh(){ playTone({freq:180, sweep:600, dur:0.18, type:'sawtooth', vol:0.12}); }
  function sfxHit(){
    playTone({freq:90, sweep:40, dur:0.12, type:'square', vol:0.25});
    playTone({freq:1200, dur:0.05, type:'triangle', vol:0.1});
  }
  function sfxBlock(){ playTone({freq:500, sweep:300, dur:0.08, type:'square', vol:0.15}); }
  function sfxKO(){
    playTone({freq:60, sweep:20, dur:0.6, type:'sawtooth', vol:0.3});
    playTone({freq:900, sweep:80, dur:0.35, type:'square', vol:0.12});
  }
  function sfxBlip(){ playTone({freq:800, dur:0.05, type:'square', vol:0.1}); }

  // ---------- input ----------
  window.addEventListener('keydown', (e) => {
    if(['Space','KeyA','KeyD','KeyS','KeyR'].includes(e.code)) e.preventDefault();
    ensureAudio();
    if(e.code === 'KeyA') keys.a = true;
    if(e.code === 'KeyD') keys.d = true;
    if(e.code === 'KeyS') keys.s = true;
    if(e.code === 'Space'){
      if(gameState === STATE.TITLE) startFight();
      else if(gameState === STATE.FIGHT) tryKick();
    }
    if(e.code === 'KeyR' && gameState === STATE.ROUND_OVER) resetGame();
  });
  window.addEventListener('keyup', (e) => {
    if(e.code === 'KeyA') keys.a = false;
    if(e.code === 'KeyD') keys.d = false;
    if(e.code === 'KeyS') keys.s = false;
  });
  canvas.addEventListener('click', () => {
    ensureAudio();
    if(gameState === STATE.TITLE) startFight();
    else if(gameState === STATE.ROUND_OVER) resetGame();
  });

  // ---------- combat ----------
  function tryKick(){
    if(!player.isAttacking && player.isGrounded && player.attackCooldown<=0 && player.staggerTimer<=0){
      player.isAttacking = true;
      player.isGrounded = false;
      player.attackTimer = 34;
      player.vy = -12.5;
      sfxWhoosh();
    }
  }

  function checkPlayerKickHit(){
    if(gameState !== STATE.FIGHT || opponent.staggerTimer>0) return;
    const reach = player.x + player.facing*95;
    const dist = Math.abs(reach - opponent.x);
    if(dist < 34){
      const dmg = 16 + Math.floor(Math.random()*6);
      opponent.hp = Math.max(0, opponent.hp - dmg);
      opponent.targetNeckScaleY = 0.15;
      opponent.compressionTimer = 26;
      opponent.staggerTimer = 30;
      opponent.x += player.facing*26;
      opponent.x = Math.max(60, Math.min(W-60, opponent.x));
      opponent.dialog = pick(OPPONENT_HIT_LINES); opponent.dialogTimer = 70;
      player.dialog = pick(PLAYER_TAUNTS); player.dialogTimer = 70;

      player.comboCount++;
      player.comboTimer = 90;

      const impactX = opponent.x - player.facing*14;
      const impactY = GROUND_Y - 44 - TORSO_HEIGHT - NECK_HEIGHT;
      spawnImpactParticles(impactX, impactY, player.facing, 20);
      shockwaves.push({x:impactX, y:impactY, r:4, maxR:60, alpha:1});
      floatTexts.push({x:impactX, y:impactY-20, text:`-${dmg}`, color:'#ff3366', vy:-0.6, alpha:1, size:16});
      if(player.comboCount>1){
        floatTexts.push({x:impactX, y:impactY-40, text:`${player.comboCount} HIT COMBO`, color:'#ffcc00', vy:-0.4, alpha:1, size:12});
      }
      addShake(8,10);
      hitStop = 4;
      sfxHit();
    }
  }

  function checkOpponentJabHit(){
    if(gameState !== STATE.FIGHT || player.staggerTimer>0) return;
    const reach = opponent.x + opponent.facing*55;
    const dist = Math.abs(reach - player.x);
    if(dist < 30){
      if(player.isBlocking){
        player.hp = Math.max(0, player.hp - 2);
        shockwaves.push({x:player.x, y:GROUND_Y-60, r:2, maxR:26, alpha:0.8});
        addShake(3,6);
        sfxBlock();
      } else {
        const dmg = 8 + Math.floor(Math.random()*5);
        player.hp = Math.max(0, player.hp - dmg);
        player.staggerTimer = 22;
        player.x += -opponent.facing*16;
        player.x = Math.max(60, Math.min(W-60, player.x));
        floatTexts.push({x:player.x, y:GROUND_Y-140, text:`-${dmg}`, color:'#ff9944', vy:-0.6, alpha:1, size:14});
        addShake(5,8);
        hitStop = 2;
        sfxHit();
      }
    }
  }

  function updateOpponentAI(){
    const ai = opponent.ai;
    let targetExtend = 0.05;

    if(opponent.staggerTimer > 0){
      ai.state = 'STAGGER';
    } else {
      const dist = player.x - opponent.x;
      const adist = Math.abs(dist);
      ai.timer--;
      switch(ai.state){
        case 'STAGGER':
          ai.state = 'IDLE'; ai.timer = 30;
          break;
        case 'IDLE':
          if(ai.timer <= 0){
            if(adist > 120){ ai.state = 'APPROACH'; ai.timer = 999; }
            else { ai.state = Math.random()<0.6 ? 'WINDUP' : 'RETREAT'; ai.timer = ai.state==='WINDUP' ? 26 : 30; }
          }
          break;
        case 'APPROACH':
          opponent.x += Math.sign(dist)*2.6;
          if(adist <= 110){ ai.state = 'IDLE'; ai.timer = 20+Math.random()*30; }
          break;
        case 'RETREAT':
          opponent.x += -Math.sign(dist)*2.2;
          if(ai.timer <= 0){ ai.state = 'IDLE'; ai.timer = 20; }
          break;
        case 'WINDUP':
          targetExtend = -0.3;
          if(ai.timer <= 0){ ai.state = 'JAB'; ai.timer = 10; }
          break;
        case 'JAB':
          targetExtend = 1.0;
          if(ai.timer === 7) checkOpponentJabHit();
          if(ai.timer <= 0){ ai.state = 'RECOVER'; ai.timer = 26; }
          break;
        case 'RECOVER':
          targetExtend = 0.05;
          if(ai.timer <= 0){ ai.state = 'IDLE'; ai.timer = 30+Math.random()*40; }
          break;
      }
    }

    opponent.isAttacking = (ai.state === 'WINDUP' || ai.state === 'JAB');
    opponent.armExtend += (targetExtend - (opponent.armExtend||0)) * 0.3;
    opponent.x = Math.max(60, Math.min(W-60, opponent.x));
  }

  function updateFight(){
    if(player.attackCooldown>0) player.attackCooldown--;
    if(player.staggerTimer>0) player.staggerTimer--;
    if(player.comboTimer>0){ player.comboTimer--; if(player.comboTimer===0) player.comboCount=0; }
    if(player.dialogTimer>0) player.dialogTimer--;
    if(opponent.dialogTimer>0) opponent.dialogTimer--;

    if(!player.isAttacking && player.staggerTimer<=0){
      player.facing = opponent.x >= player.x ? 1 : -1;
    }
    opponent.facing = player.x >= opponent.x ? 1 : -1;

    player.isBlocking = keys.s && player.isGrounded && !player.isAttacking && player.staggerTimer<=0;

    if(player.staggerTimer<=0 && !player.isBlocking){
      if(keys.a) player.x -= player.speed;
      if(keys.d) player.x += player.speed;
    }
    player.x = Math.max(60, Math.min(W-60, player.x));

    if(!player.isGrounded){
      player.vy += GRAVITY;
      player.y += player.vy;
      if(player.y >= 0){
        player.y = 0; player.vy = 0; player.isGrounded = true;
        player.isAttacking = false; player.attackCooldown = 18;
      }
    }

    if(player.isAttacking){
      player.attackTimer--;
      if(player.attackTimer > 18) player.x += player.facing*3.2;
      player.x = Math.max(60, Math.min(W-60, player.x));
      if(player.attackTimer === 14) checkPlayerKickHit();
      if(player.attackTimer <= 0) player.isAttacking = false;
    }

    if(opponent.staggerTimer>0) opponent.staggerTimer--;
    updateOpponentAI();

    opponent.neckScaleY += (opponent.targetNeckScaleY - opponent.neckScaleY) * 0.15;
    if(opponent.compressionTimer>0){
      opponent.compressionTimer--;
      if(opponent.compressionTimer===0) opponent.targetNeckScaleY = 1;
    }

    roundTimerAcc++;
    if(roundTimerAcc >= 60){
      roundTimerAcc = 0;
      roundTime--;
      if(roundTime <= 0){
        roundTime = 0;
        winner = player.hp >= opponent.hp ? 'player' : 'opponent';
        winMethod = 'timeout';
        endRound();
      }
    }

    if(gameState === STATE.FIGHT && opponent.hp <= 0){
      triggerFinisher();
    } else if(gameState === STATE.FIGHT && player.hp <= 0){
      winner = 'opponent'; winMethod = 'ko'; player.staggerTimer = 99999;
      endRound();
    }

    if(shake.t>0) shake.t--;
  }

  function endRound(){
    gameState = STATE.ROUND_OVER;
    addShake(6,20);
  }

  function triggerFinisher(){
    gameState = STATE.ROUND_OVER;
    winner = 'player';
    winMethod = 'ko';
    opponent.targetNeckScaleY = 0.02;
    opponent.compressionTimer = 999;
    opponent.koTimer = 90;

    const hx = opponent.x;
    const hy = GROUND_Y - 44 - TORSO_HEIGHT - NECK_HEIGHT - HEAD_RADIUS;
    opponent.headOffset.baseX = hx;
    opponent.headOffset.baseY = hy;
    opponent.headOffset.x = 0; opponent.headOffset.y = 0; opponent.headOffset.rot = 0;
    opponent.headOffset.vx = player.facing*9 + (Math.random()*2-1);
    opponent.headOffset.vy = -13;
    opponent.headOffset.vr = 0.35*player.facing;

    spawnImpactParticles(hx, hy, player.facing, 46);
    for(let i=0;i<3;i++) shockwaves.push({x:hx, y:hy, r:4+i*8, maxR:110+i*20, alpha:1});
    floatTexts.push({x:W/2, y:H/2-50, text:'NECK KICKED CLEAN OFF', color:'#ff3366', vy:-0.15, alpha:1, size:22, center:true});
    addShake(16,40);
    hitStop = 10;
    sfxKO();
  }

  function updateFinisherFx(){
    if(winner==='player' && winMethod==='ko'){
      const h = opponent.headOffset;
      h.vy += GRAVITY*0.55;
      h.x += h.vx;
      h.y += h.vy;
      h.rot += h.vr;
    }
    if(shake.t>0) shake.t--;
  }

  function spawnImpactParticles(x,y,dir=1,count=20){
    for(let i=0;i<count;i++){
      particles.push({
        x, y,
        vx: dir*(5+Math.random()*9),
        vy: -4+Math.random()*8,
        radius: 1.5+Math.random()*3.5,
        alpha: 1,
        color: Math.random()<0.5 ? '#ffffff' : (Math.random()<0.5 ? '#00ffcc' : '#ff3366'),
        grav: 0.25+Math.random()*0.15
      });
    }
  }

  function updateFx(){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vy += p.grav;
      p.x += p.vx; p.y += p.vy;
      p.alpha -= 0.018;
      if(p.x > W-p.radius){ p.x = W-p.radius; p.vx *= -0.4; }
      if(p.x < p.radius){ p.x = p.radius; p.vx *= -0.4; }
      if(p.y > GROUND_Y && p.vy > 0){ p.y = GROUND_Y; p.vy *= -0.35; }
      if(p.alpha <= 0) particles.splice(i,1);
    }
    for(let i=shockwaves.length-1;i>=0;i--){
      const s = shockwaves[i];
      s.r += (s.maxR - s.r)*0.18 + 1;
      s.alpha -= 0.045;
      if(s.alpha <= 0 || s.r >= s.maxR) shockwaves.splice(i,1);
    }
    for(let i=floatTexts.length-1;i>=0;i--){
      const t = floatTexts[i];
      t.y += t.vy;
      t.alpha -= 0.014;
      if(t.alpha <= 0) floatTexts.splice(i,1);
    }
  }

  // ---------- lifecycle ----------
  function initTitle(){
    player.x = 220; player.y = 0; player.facing = 1; player.armExtend = 0;
    player.dialog = pick(PLAYER_INTRO_LINES); player.dialogTimer = 99999;
    opponent.x = 700; opponent.facing = -1; opponent.armExtend = 0;
    opponent.dialog = pick(OPPONENT_INTRO_LINES); opponent.dialogTimer = 99999;
    opponent.ai = { state:'IDLE', timer:40 };
  }

  function resetGame(){
    player.x=220; player.y=0; player.vy=0; player.facing=1;
    player.hp=100; player.isAttacking=false; player.attackTimer=0; player.attackCooldown=0;
    player.isGrounded=true; player.isBlocking=false; player.staggerTimer=0;
    player.comboCount=0; player.comboTimer=0; player.armExtend=0;
    player.dialog=pick(PLAYER_INTRO_LINES); player.dialogTimer=150;

    opponent.x=700; opponent.facing=-1;
    opponent.hp=100; opponent.neckScaleY=1; opponent.targetNeckScaleY=1; opponent.compressionTimer=0;
    opponent.staggerTimer=0; opponent.ai={state:'IDLE', timer:40}; opponent.isAttacking=false;
    opponent.armExtend=0; opponent.dialog=pick(OPPONENT_INTRO_LINES); opponent.dialogTimer=150;
    opponent.koTimer=0; opponent.headOffset={x:0,y:0,rot:0,vx:0,vy:0,vr:0,baseX:0,baseY:0};

    roundTime=60; roundTimerAcc=0;
    particles=[]; shockwaves=[]; floatTexts=[];
    winner=null; winMethod=null;
    shake={t:0,mag:0}; hitStop=0;
    gameState=STATE.FIGHT;
    sfxBlip();
  }

  function startFight(){ resetGame(); }

  // ---------- drawing ----------
  function updateIdleAnim(){
    if(gameState !== STATE.FIGHT){
      player.armExtend = Math.sin(frame*0.1)*0.06;
      opponent.armExtend = Math.sin(frame*0.1+1.7)*0.06;
    } else if(!player.isAttacking && player.staggerTimer<=0 && !player.isBlocking){
      player.armExtend = Math.sin(frame*0.1)*0.06;
    } else if(player.isBlocking){
      player.armExtend = 0;
    }
  }

  function drawBackground(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a0e1c');
    g.addColorStop(1,'#05070f');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    for(const s of stars){
      const a = 0.4+0.6*Math.abs(Math.sin(frame*0.02+s.tw));
      ctx.fillStyle = `rgba(180,220,255,${a*0.6})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }

    ctx.save();
    ctx.globalAlpha = 0.22;
    for(let i=0;i<6;i++){
      const bx = ((i*170 + frame*0.15) % (W+100)) - 50;
      ctx.fillStyle = i%2===0 ? '#00ffcc' : '#ff3366';
      ctx.fillRect(bx, GROUND_Y-40-(i%3)*22, 26, 40+(i%3)*22);
    }
    ctx.restore();
  }

  function drawFloor(){
    ctx.save();
    const offset = (frame*1.2) % 40;
    ctx.strokeStyle = 'rgba(0,255,204,0.14)';
    ctx.lineWidth = 1;
    for(let x=-40; x<W+40; x+=40){
      ctx.beginPath();
      ctx.moveTo(x-offset, GROUND_Y);
      ctx.lineTo(x-offset-60, H);
      ctx.stroke();
    }
    for(let y=GROUND_Y; y<H; y+=14){
      const t = (y-GROUND_Y)/(H-GROUND_Y);
      ctx.strokeStyle = `rgba(0,255,204,${0.18*(1-t)})`;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    const grd = ctx.createLinearGradient(0,GROUND_Y-2,0,GROUND_Y+2);
    grd.addColorStop(0,'rgba(0,255,204,0)');
    grd.addColorStop(0.5,'rgba(0,255,204,0.9)');
    grd.addColorStop(1,'rgba(0,255,204,0)');
    ctx.strokeStyle = grd;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(W,GROUND_Y); ctx.stroke();
    ctx.restore();
  }

  function poseArm(x,y,dir,extend){
    const neutral = {ex:x+dir*10, ey:y+18, hx:x+dir*6,  hy:y+32};
    const back    = {ex:x+dir*4,  ey:y+10, hx:x-dir*2,  hy:y+26};
    const thrust  = {ex:x+dir*4,  ey:y+4,  hx:x+dir*30, hy:y+2};
    let elbow, hand;
    if(extend < 0){
      const t = Math.min(1,-extend);
      elbow = {x:lerp(neutral.ex,back.ex,t), y:lerp(neutral.ey,back.ey,t)};
      hand  = {x:lerp(neutral.hx,back.hx,t), y:lerp(neutral.hy,back.hy,t)};
    } else {
      const t = Math.min(1,extend);
      elbow = {x:lerp(neutral.ex,thrust.ex,t), y:lerp(neutral.ey,thrust.ey,t)};
      hand  = {x:lerp(neutral.hx,thrust.hx,t), y:lerp(neutral.hy,thrust.hy,t)};
    }
    return {elbow,hand};
  }

  function drawArm(x,y,extend,dir,color){
    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    const {elbow,hand} = poseArm(x,y,dir,extend);
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(elbow.x,elbow.y);
    ctx.lineTo(hand.x,hand.y);
    ctx.stroke();
  }

  function drawBlockGuard(x,y,facing,color){
    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x-6*facing, y+2); ctx.lineTo(x+14*facing, y+18);
    ctx.moveTo(x+6*facing, y+2); ctx.lineTo(x-10*facing, y+18);
    ctx.stroke();
  }

  function drawLeg(x, hipY, actor, groundY, isPlayer, side, facing){
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    let kneeX=x, kneeY=hipY+24, footX=x-2*facing, footY=groundY;

    if(isPlayer && actor.isAttacking && side===1){
      const t = actor.attackTimer;
      if(t > 24){
        const p = (34-t)/10;
        kneeX = x + facing*lerp(0,10,p);
        kneeY = hipY + lerp(24,14,p);
        footX = x + facing*lerp(-2,4,p);
        footY = hipY + lerp(20,30,p);
      } else if(t > 10){
        const p = Math.min(1,(24-t)/14*1.3);
        kneeX = x + facing*lerp(10,42,p);
        kneeY = hipY + lerp(14,4,p);
        footX = x + facing*lerp(4,88,easeOutQuad(p));
        footY = hipY + lerp(30,-8,p);
      } else {
        const p = (10-t)/10;
        kneeX = x + facing*lerp(42,16,p);
        kneeY = hipY + lerp(4,20,p);
        footX = x + facing*lerp(88,6,p);
        footY = hipY + lerp(-8,42,p);
      }
    } else if(isPlayer && !actor.isGrounded){
      kneeY = hipY+22;
      footY = hipY+44;
    } else if(actor.staggerTimer > 0){
      kneeX = x - facing*4;
      footX = x - facing*8;
    }

    ctx.beginPath(); ctx.moveTo(x,hipY); ctx.lineTo(kneeX,kneeY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(kneeX,kneeY); ctx.lineTo(footX,footY); ctx.stroke();

    if(isPlayer && actor.isAttacking && side===1 && actor.attackTimer<=24 && actor.attackTimer>10){
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      const a1 = facing>0 ? -0.7 : Math.PI-2.4;
      const a2 = facing>0 ? 0.7 : Math.PI+2.4;
      ctx.beginPath();
      ctx.arc(x+facing*24, hipY+4, 30, a1, a2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawCharacter(actor, neckScale, isPlayer, opts={}){
    const color = isPlayer ? '#00ffcc' : '#ff3366';
    const dimColor = isPlayer ? '#00aa99' : '#aa2244';
    const facing = actor.facing || (isPlayer ? 1 : -1);
    const bob = ((gameState===STATE.FIGHT && actor.isAttacking) || actor.staggerTimer>0)
      ? 0 : Math.sin(frame*0.08+(isPlayer?0:2))*2;

    const groundY = GROUND_Y + (actor.y||0);
    const hipY = groundY - 44 + bob;
    const torsoY = hipY - TORSO_HEIGHT;
    const shoulderY = torsoY + 8;
    const neckH = NECK_HEIGHT*neckScale;
    const neckY = torsoY - neckH;
    const headY = neckY - HEAD_RADIUS;

    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 9;

    ctx.strokeStyle = dimColor;
    drawLeg(actor.x-8*facing, hipY, actor, groundY, isPlayer, -1, facing);
    ctx.strokeStyle = color;
    drawLeg(actor.x+8*facing, hipY, actor, groundY, isPlayer, 1, facing);

    ctx.lineWidth = 4;
    ctx.strokeStyle = color;
    if(actor.staggerTimer > 0){
      ctx.save();
      ctx.translate(actor.x, torsoY+TORSO_HEIGHT/2);
      ctx.rotate(-facing*0.14);
      ctx.strokeRect(-14,-TORSO_HEIGHT/2,28,TORSO_HEIGHT);
      ctx.restore();
    } else {
      ctx.strokeRect(actor.x-14, torsoY, 28, TORSO_HEIGHT);
    }

    drawArm(actor.x-9*facing, shoulderY, (actor.armExtend||0)*0.3, -facing, dimColor);
    if(actor.isBlocking){
      drawBlockGuard(actor.x, shoulderY, facing, color);
    } else {
      drawArm(actor.x+9*facing, shoulderY, actor.armExtend||0, facing, color);
    }

    if(!opts.skipHead){
      if(neckH > 1){
        ctx.fillStyle = isPlayer ? color : '#ffffff';
        ctx.fillRect(actor.x-4, neckY, 8, neckH);
      }
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(actor.x, headY, HEAD_RADIUS, 0, Math.PI*2);
      ctx.fill();
      if(!isPlayer){
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(actor.x-HEAD_RADIUS+3, headY-2);
        ctx.lineTo(actor.x+HEAD_RADIUS-3, headY-2);
        ctx.stroke();
      }
    }
    ctx.restore();

    if(actor.dialogTimer > 0){
      drawTextBubble(actor.dialog, actor.x, headY-HEAD_RADIUS, color);
    }
  }

  function drawOpponentFinisher(){
    drawCharacter(opponent, 0.02, false, {skipHead:true});
    const h = opponent.headOffset;
    const hx = h.baseX + h.x;
    const hy = h.baseY + h.y;
    ctx.save();
    ctx.translate(hx,hy);
    ctx.rotate(h.rot);
    ctx.shadowColor = '#ff3366';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#ff3366';
    ctx.beginPath();
    ctx.arc(0,0,HEAD_RADIUS,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-HEAD_RADIUS,-2); ctx.lineTo(0,-2);
    ctx.stroke();
    ctx.restore();
  }

  function drawTextBubble(text, x, y, borderColor){
    ctx.save();
    ctx.font = '12px "Courier New", monospace';
    const textWidth = ctx.measureText(text).width;
    const paddingX=10, paddingY=6;
    const bw = textWidth+paddingX*2;
    const bh = 20+paddingY*2;
    const bx = x-bw/2;
    const by = y-bh-10;

    ctx.fillStyle = '#05070f';
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 2;
    ctx.shadowColor = borderColor;
    ctx.shadowBlur = 6;
    ctx.fillRect(bx,by,bw,bh);
    ctx.strokeRect(bx,by,bw,bh);
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.moveTo(x-5,by+bh); ctx.lineTo(x,by+bh+6); ctx.lineTo(x+5,by+bh);
    ctx.fillStyle = '#05070f';
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#e8f4ff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, by+bh/2);
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      ctx.globalAlpha = Math.max(0,p.alpha);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function drawShockwaves(){
    for(const s of shockwaves){
      ctx.globalAlpha = Math.max(0,s.alpha);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloatTexts(){
    for(const t of floatTexts){
      ctx.globalAlpha = Math.max(0,t.alpha);
      ctx.fillStyle = t.color;
      ctx.font = `bold ${t.size}px "Courier New", monospace`;
      ctx.textAlign = t.center ? 'center' : 'left';
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawScanlines(){
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = '#000';
    for(let y=0;y<H;y+=3){ ctx.fillRect(0,y,W,1); }
    ctx.restore();
  }

  function drawVignette(){
    const g = ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  function drawHealthBar(x,y,w,hp,maxHp,color,label,rightAlign){
    const h = 14;
    ctx.save();
    ctx.fillStyle = '#131a2c';
    ctx.fillRect(x,y,w,h);
    ctx.strokeStyle = '#2a3757';
    ctx.lineWidth = 2;
    ctx.strokeRect(x,y,w,h);

    const pct = Math.max(0,hp/maxHp);
    const barW = w*pct;
    const barColor = pct<0.25 ? '#ff3366' : (pct<0.5 ? '#ffcc00' : color);
    ctx.fillStyle = barColor;
    ctx.shadowColor = barColor;
    ctx.shadowBlur = 8;
    if(rightAlign) ctx.fillRect(x+w-barW,y,barW,h);
    else ctx.fillRect(x,y,barW,h);
    ctx.shadowBlur = 0;

    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.fillStyle = '#e8f4ff';
    ctx.textAlign = rightAlign ? 'right' : 'left';
    ctx.fillText(label, rightAlign ? x+w : x, y-4);
    ctx.restore();
  }

  function drawHUD(){
    ctx.save();
    ctx.fillStyle = 'rgba(5,7,15,0.55)';
    ctx.fillRect(0,0,W,62);
    ctx.strokeStyle = 'rgba(0,255,204,0.2)';
    ctx.beginPath(); ctx.moveTo(0,62); ctx.lineTo(W,62); ctx.stroke();

    drawHealthBar(20, 20, 300, player.hp, player.maxHp, '#00ffcc', 'P1', false);
    drawHealthBar(W-320, 20, 300, opponent.hp, opponent.maxHp, '#ff3366', 'NEO-FOE', true);

    if(player.comboCount > 1){
      ctx.fillStyle = '#ffcc00';
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`${player.comboCount} HIT COMBO`, 20, 55);
    }

    ctx.textAlign = 'center';
    ctx.font = 'bold 24px "Courier New", monospace';
    ctx.fillStyle = roundTime<=10 ? '#ff3366' : '#e8f4ff';
    ctx.shadowColor = roundTime<=10 ? '#ff3366' : '#00ffcc';
    ctx.shadowBlur = 8;
    ctx.fillText(String(roundTime).padStart(2,'0'), W/2, 34);
    ctx.shadowBlur = 0;

    ctx.font = '10px "Courier New", monospace';
    ctx.fillStyle = '#5b6a8c';
    ctx.fillText('VS', W/2, 50);
    ctx.restore();
  }

  function drawTitleScreen(){
    ctx.save();
    ctx.fillStyle = 'rgba(5,7,15,0.55)';
    ctx.fillRect(0,0,W,H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ffcc';
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 20;
    ctx.font = 'bold 44px "Courier New", monospace';
    ctx.fillText('NEO-COMBAT', W/2, H/2-60);

    ctx.fillStyle = '#ff3366';
    ctx.shadowColor = '#ff3366';
    ctx.font = 'bold 24px "Courier New", monospace';
    ctx.fillText('N E C K   K I C K E R', W/2, H/2-24);
    ctx.shadowBlur = 0;

    if(Math.floor(frame/30)%2===0){
      ctx.fillStyle = '#e8f4ff';
      ctx.font = '16px "Courier New", monospace';
      ctx.fillText('PRESS SPACE TO FIGHT', W/2, H/2+30);
    }

    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = '#7c8db3';
    ctx.fillText('A/D MOVE   S BLOCK   SPACE NECK KICK', W/2, H/2+60);
    ctx.restore();
  }

  function drawRoundOverOverlay(){
    ctx.save();
    ctx.fillStyle = 'rgba(5,7,15,0.5)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';

    const headline = winMethod==='ko' ? 'K.O.' : 'TIME UP';
    ctx.fillStyle = winner==='player' ? '#00ffcc' : '#ff3366';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 24;
    ctx.font = 'bold 52px "Courier New", monospace';
    ctx.fillText(headline, W/2, H/2-10);
    ctx.shadowBlur = 0;

    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillStyle = '#e8f4ff';
    ctx.fillText(winner==='player' ? 'YOU WIN' : 'YOU LOSE', W/2, H/2+24);

    if(Math.floor(frame/30)%2===0){
      ctx.font = '13px "Courier New", monospace';
      ctx.fillStyle = '#7c8db3';
      ctx.fillText('PRESS R TO FIGHT AGAIN', W/2, H/2+56);
    }
    ctx.restore();
  }

  function draw(){
    updateIdleAnim();
    ctx.clearRect(0,0,W,H);
    drawBackground();

    ctx.save();
    if(shake.t > 0){
      const s = shake.mag*(shake.t/20);
      ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
    }
    drawFloor();
    drawShockwaves();
    drawCharacter(player, 1, true);
    if(gameState===STATE.ROUND_OVER && winner==='player' && winMethod==='ko'){
      drawOpponentFinisher();
    } else {
      drawCharacter(opponent, opponent.neckScaleY, false);
    }
    drawParticles();
    drawFloatTexts();
    ctx.restore();

    drawScanlines();
    drawVignette();
    drawHUD();

    if(gameState===STATE.TITLE) drawTitleScreen();
    if(gameState===STATE.ROUND_OVER) drawRoundOverOverlay();
  }

  function update(){
    frame++;
    if(gameState===STATE.FIGHT){
      if(hitStop > 0) hitStop--; else updateFight();
    } else if(gameState===STATE.ROUND_OVER){
      updateFinisherFx();
    }
    updateFx();
    draw();
    requestAnimationFrame(update);
  }

  initTitle();
  update();
})();
</script>
</body>
